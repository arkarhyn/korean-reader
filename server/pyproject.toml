[project]
name = "korean-reader-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "kiwipiepy>=0.24.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: hits the real krdict API (skipped without KRDICT_API_KEY)"]
